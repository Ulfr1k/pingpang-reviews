name: Aggregate Ratings

on:
  issues:
    types: [opened, edited, closed, reopened, deleted]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Aggregate ratings from Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const repo = process.env.REPO;
          const [owner, name] = repo.split('/');

          let allIssues = [];
          let endCursor = null;
          do {
            const after = endCursor ? '"' + endCursor + '"' : 'null';
            const query = 'query{repository(owner:"' + owner + '",name:"' + name + '"){issues(first:100,labels:"rating",after:' + after + '){nodes{number title body state}pageInfo{endCursor hasNextPage}}}}';
            const res = execSync('gh api graphql -f query=' + JSON.stringify(query), { encoding: 'utf-8' });
            const json = JSON.parse(res);
            const data = json.data.repository.issues;
            allIssues.push(...data.nodes);
            endCursor = data.pageInfo.hasNextPage ? data.pageInfo.endCursor : null;
          } while (endCursor);

          console.log('Fetched ' + allIssues.length + ' rating issues');
          const dims = ['spin_reversal','control','attack','weirdness','durability'];
          const byCode = {};

          for (const issue of allIssues) {
            if (issue.state !== 'OPEN') continue;
            const body = issue.body || '';
            function getField(label) {
              const esc = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp('###?\\s*' + esc + '\\s*\\n+\\s*([^\\n#]+)', 'i');
              const m = body.match(re);
              return m ? m[1].trim() : null;
            }

            const code = getField('rubber_code') || getField('Code');
            if (!code) continue;
            const entry = {
              issueNumber: issue.number,
              style: getField('style'),
              position: getField('position'),
              sponge: getField('sponge'),
              comment: getField('comment'),
              ratings: {},
            };
            for (const d of dims) {
              const val = parseInt(getField(d), 10);
              if (val >= 1 && val <= 5) entry.ratings[d] = val;
            }
            if (!byCode[code]) byCode[code] = [];
            byCode[code].push(entry);
          }

          const output = {};
          for (const [code, entries] of Object.entries(byCode)) {
            const sums = {};
            dims.forEach(d => sums[d] = 0);
            let count = 0;
            for (const e of entries) {
              let has = false;
              for (const d of dims) { if (e.ratings[d] != null) { sums[d] += e.ratings[d]; has = true; } }
              if (has) count++;
            }
            const avg = {};
            for (const d of dims) avg[d] = count ? +(sums[d]/count).toFixed(2) : 0;
            const overall = count ? +(dims.reduce((s,d)=>s+avg[d],0)/dims.length).toFixed(2) : 0;
            const styles = {};
            entries.forEach(e => { if (e.style) styles[e.style] = (styles[e.style]||0)+1; });
            output[code] = { average: avg, overall, count, styles, reviews: entries };
          }

          fs.writeFileSync('data/ratings.json', JSON.stringify({
            meta: { generatedAt: new Date().toISOString(), totalReviews: allIssues.filter(i=>i.state==='OPEN').length },
            ratings: output
          }, null, 2));
          console.log('Wrote ratings for ' + Object.keys(output).length + ' rubbers');
          SCRIPT

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ratings.json
          git diff --quiet --cached && echo "No rating changes" || (git commit -m "chore: update aggregated ratings" && git push)

      - name: Trigger site rebuild
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.repository_owner }}/pingpang-site
          event-type: data-updated
