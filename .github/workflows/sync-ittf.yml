name: Sync ITTF Long Rubbers

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-ittf
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        working-directory: scraper
        run: node scraper.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- data/larc-long-rubbers.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data changed!"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/larc-long-rubbers.json
          git commit -m "chore: sync ITTF long rubber data ($(date -u +%Y-%m-%d))"
          git push

      - name: Trigger site rebuild
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.repository_owner }}/pingpang-site
          event-type: data-updated

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ITTF sync failed — ${{ steps.changes.outputs.changed == 'true' && 'after partial commit' || 'no data written' }} (${{ github.run_number }})`,
              body: `The weekly ITTF long rubber sync failed. Check the [workflow run](${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ["sync-failure", "needs-triage"]
            });
